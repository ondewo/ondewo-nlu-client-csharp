name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch/PR ref: a new push supersedes the in-flight run. Never on master, so every
# commit on the release branch keeps its own result instead of being cancelled by the next push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  lint:
    name: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # markdownlint-cli2 + the hygiene hooks. The commit-msg hooks (conventional-pre-commit,
      # giticket) are not part of `pre-commit run --all-files` and are checked on commit instead.
      - uses: pre-commit/action@v3.0.1

  build:
    name: dotnet build + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The api submodule is NOT checked out. This job builds and tests the stubs that are COMMITTED
      # under api/; it never builds the compiler image and never runs protoc - regenerating the
      # stubs is a separate, slow, docker-bound concern driven by `make build` on a developer
      # machine, and Directory.Build.props mirrors the pins so a build without it works.
      - uses: actions/checkout@v7

      # ...and the compiler submodule IS, on its own. `make check_dotnet_properties` below reads the
      # pins out of its Dockerfile ARG lines, so with nothing on disk it had nothing to compare the
      # committed Directory.Build.props against: it warned and exited 0, which made the step below a
      # guaranteed no-op that had never once verified a pin. The target now fails in that situation,
      # and this step is what keeps it able to do its job. One small public repository, depth 1.
      - name: Check out the pinned proto-compiler submodule
        run: git submodule update --init --depth 1 ondewo-proto-compiler

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Fails the build when the committed stubs are missing or empty, so none of the steps below
      # can pass by having nothing to do.
      - name: Check the committed stubs are present
        run: |
          set -eu
          test -f Ondewo.NLU.Client.csproj
          stubs=$(find api -type f -name '*.cs' | wc -l)
          echo "committed csharp stub files: $stubs"
          test "$stubs" -gt 0

      - name: Verify the committed MSBuild pins
        run: make check_dotnet_properties

      - name: Build the generated library
        run: make build_library

      # Runs the xunit suite over the committed stubs and fails when coverage of the hand-written
      # sources (everything outside api/) drops below COVERAGE_THRESHOLD.
      - name: Test with the coverage gate
        run: make test

      # The credential-free half of `make publish`: pack, assert the packed nuspec carries the
      # metadata nuget.org expects, then resolve the .nupkg out of a local folder feed into a
      # throwaway consumer project. No API key is involved and nothing is uploaded anywhere, so
      # the publishing path is exercised on every push instead of first on a release tag.
      - name: Dry-run the NuGet publish
        run: make publish_dry_run

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: |
            nupkg/*.nupkg
            nupkg/*.snupkg
          if-no-files-found: error
