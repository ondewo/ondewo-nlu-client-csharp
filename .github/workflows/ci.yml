name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch/PR ref: a new push supersedes the in-flight run. Never on master, so every
# commit on the release branch keeps its own result instead of being cancelled by the next push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  lint:
    name: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # markdownlint-cli2 + the hygiene hooks. The commit-msg hooks (conventional-pre-commit,
      # giticket) are not part of `pre-commit run --all-files` and are checked on commit instead.
      - uses: pre-commit/action@v3.0.1

  build:
    name: dotnet build + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # NO submodules. This job builds and tests the stubs that are COMMITTED under api/; it never
      # builds the compiler image and never runs protoc - regenerating the stubs is a separate,
      # slow, docker-bound concern driven by `make build` on a developer machine.
      # The pins the generated project file reads live in the compiler submodule's Dockerfile and
      # are mirrored into Directory.Build.props, which is what makes a submodule-free build work;
      # `make check_dotnet_properties` is what keeps the two from drifting.
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Fails the build when the committed stubs are missing or empty, so none of the steps below
      # can pass by having nothing to do.
      - name: Check the committed stubs are present
        run: |
          set -eu
          test -f Ondewo.NLU.Client.csproj
          stubs=$(find api -type f -name '*.cs' | wc -l)
          echo "committed csharp stub files: $stubs"
          test "$stubs" -gt 0

      - name: Verify the committed MSBuild pins
        run: make check_dotnet_properties

      - name: Build the generated library
        run: make build_library

      # Runs the xunit suite over the committed stubs and fails when coverage of the hand-written
      # sources (everything outside api/) drops below COVERAGE_THRESHOLD.
      - name: Test with the coverage gate
        run: make test

      # The credential-free half of `make publish`: pack, assert the packed nuspec carries the
      # metadata nuget.org expects, then resolve the .nupkg out of a local folder feed into a
      # throwaway consumer project. No API key is involved and nothing is uploaded anywhere, so
      # the publishing path is exercised on every push instead of first on a release tag.
      - name: Dry-run the NuGet publish
        run: make publish_dry_run

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: |
            nupkg/*.nupkg
            nupkg/*.snupkg
          if-no-files-found: error
